# Builds once, then deploys the same build to:
#   - the VPS (hosting-dh) through dh-deploy-gate: releases + atomic `current` symlink + rollback
#   - the old shared hosting through FTP, kept in parallel until DNS points to the VPS
# Secrets: DEPLOY_* from vps-administrare-website/scripts/deploy-setup.sh, FTP_* for the old hosting.
name: Deploy deeabodycenter.ro

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOMAIN: deeabodycenter.ro

jobs:
  # No secrets here.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro static)
        run: npm run build

      # Both targets deploy exactly this build.
      - name: Package release
        run: tar -czf "$RUNNER_TEMP/release.tar.gz" -C dist . && mv "$RUNNER_TEMP/release.tar.gz" release.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.tar.gz
          retention-days: 7
          if-no-files-found: error

  # Holds the deploy key: no checkout, no npm (no third-party code runs here), first-party actions only.
  deploy-vps:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_SSH_KEY:?secret DEPLOY_SSH_KEY is empty}"
          : "${DEPLOY_KNOWN_HOSTS:?secret DEPLOY_KNOWN_HOSTS is empty}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and activate
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          : "${HOST:?secret DEPLOY_HOST is empty}"
          : "${DEPLOY_USER:?secret DEPLOY_USER is empty}"
          ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          SSH=(ssh -i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes
               -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$DEPLOY_USER@$HOST")
          "${SSH[@]}" upload "$ID" < release.tar.gz
          "${SSH[@]}" activate "$ID"
          echo "Activated $ID"
          # The release is already live here; a failed cleanup must not turn the deploy red.
          "${SSH[@]}" prune || echo "::warning::prune failed; $ID is live, old releases were not removed"

      # A failure leaves the new release live: roll back by hand if needed (see DEPLOY.md).
      - name: Smoke test
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -uo pipefail
          # --resolve needs an IP; with a hostname curl would silently use public DNS (the old hosting).
          [[ $HOST =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::DEPLOY_HOST must be an IPv4 address"; exit 1; }
          CURL=(curl -sS --connect-timeout 10 --max-time 20 --resolve "$DOMAIN:80:$HOST" --resolve "$DOMAIN:443:$HOST")

          # Before SSL the HTTP vhost serves the site; once a certificate exists HTTP redirects to HTTPS,
          # so every check runs on HTTPS and TLS errors fail instead of falling back.
          probe="$("${CURL[@]}" -o /dev/null -w '%{redirect_url}' "http://$DOMAIN/")" || { echo "::error::HTTP probe of $DOMAIN on $HOST failed"; exit 1; }
          if [[ $probe == https://* ]]; then BASE="https://$DOMAIN"; else BASE="http://$DOMAIN"; fi
          echo "Testing $BASE on $HOST"

          fail=0
          check() { # check <path> <status> [redirect target]
            local out code loc
            out="$("${CURL[@]}" -o /dev/null -w '%{http_code} %{redirect_url}' "$BASE$1")" || { echo "::error::$BASE$1: request failed"; fail=1; return; }
            code="${out%% *}"; loc="${out#* }"
            if [ "$code" != "$2" ]; then echo "::error::$BASE$1: expected $2, got $code"; fail=1; return; fi
            if [ -n "${3:-}" ] && [ "$loc" != "$3" ]; then echo "::error::$BASE$1: expected redirect to $3, got '$loc'"; fail=1; return; fi
            echo "ok   $BASE$1 -> $code $loc"
          }
          contains() { # contains <path> <text>: the right site answered, not another vhost
            local body
            # Read the whole body first: grep -q in a pipe would stop early and make curl fail under pipefail.
            body="$("${CURL[@]}" "$BASE$1")" || { echo "::error::$BASE$1: request failed"; fail=1; return; }
            if grep -qF -- "$2" <<<"$body"; then echo "ok   $BASE$1 contains '$2'"; else echo "::error::$BASE$1 does not contain '$2'"; fail=1; fi
          }
          check / 200
          contains / "Deea Body Center"
          check /tarife/ 200
          check /sitemap.xml 200
          contains /sitemap.xml "<sitemapindex"
          check /servicii/criolipoliza/ 301 "$BASE/"
          check /does-not-exist-check/ 404
          exit $fail

  # Old shared hosting: removed once DNS points to the VPS (see DEPLOY.md).
  deploy-ftp:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Unpack release
        run: mkdir dist && tar -xzf release.tar.gz -C dist

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Directorul de pe server unde se servesc fișierele (ex. /public_html/)
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Se urcă DOAR conținutul build-ului
          local-dir: ./dist/
          protocol: ftps
